<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connectors Arrears Payout</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f8fa;--surface:#fff;--surface2:#f0f2f5;--orange:#F7941D;--green:#2BA56E;--text:#1a1f2e;--muted:#6b7a99;--border:#e4e8ef;--shadow:0 2px 16px rgba(0,0,0,0.07);--shadow-lg:0 8px 32px rgba(0,0,0,0.10);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"DM Sans",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:14px 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 1px 8px rgba(0,0,0,0.06);}
.topbar img{height:44px;object-fit:contain;}
.topbar-right{display:flex;align-items:center;gap:14px;}
.data-badge{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:600;color:var(--green);background:rgba(43,165,110,0.08);border:1px solid rgba(43,165,110,0.2);padding:5px 12px;border-radius:20px;}
.data-badge .dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;}
.page{max-width:860px;margin:0 auto;padding:36px 20px 80px;}
.hero{text-align:center;margin-bottom:32px;}
.hero h1{font-family:"Syne",sans-serif;font-size:clamp(22px,4vw,38px);font-weight:800;color:var(--text);line-height:1.15;}
.hero h1 em{font-style:normal;color:var(--orange);}
.hero p{margin-top:8px;color:var(--muted);font-size:14px;}
.region-pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--orange);background:rgba(247,148,29,0.08);border:1px solid rgba(247,148,29,0.2);padding:5px 14px;border-radius:20px;margin-top:14px;}
.search-card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:32px;margin-bottom:24px;box-shadow:var(--shadow);}
.search-label{font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:12px;display:block;}
.input-row{display:flex;gap:10px;}
.input-row input{flex:1;background:var(--bg);border:2px solid var(--border);color:var(--text);font-family:"DM Sans",sans-serif;font-size:16px;font-weight:500;padding:13px 18px;border-radius:10px;outline:none;transition:border-color 0.2s;}
.input-row input:focus{border-color:var(--orange);background:#fff;}
.input-row input::placeholder{color:#bcc5d6;font-size:14px;}
.btn-search{background:var(--orange);color:#fff;border:none;font-family:"Syne",sans-serif;font-weight:700;font-size:14px;padding:13px 28px;border-radius:10px;cursor:pointer;transition:all 0.2s;white-space:nowrap;}
.btn-search:hover{background:#e8860a;box-shadow:0 4px 16px rgba(247,148,29,0.35);transform:translateY(-1px);}
.error-msg{display:none;margin-top:14px;background:#fff5f5;border:1px solid #ffd0d0;color:#d0474f;padding:12px 16px;border-radius:8px;font-size:13px;font-weight:500;}
.error-msg.show{display:block;animation:shake 0.4s ease;}
.result-card{display:none;}
.result-card.show{display:block;animation:fadeUp 0.4s ease;}
.emp-header{background:linear-gradient(135deg,#fff8f0,#ffffff);border:1px solid rgba(247,148,29,0.2);border-radius:16px 16px 0 0;padding:24px 28px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;}
.emp-info-wrap{display:flex;align-items:center;gap:14px;}
.emp-avatar{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,var(--orange),#ffb347);display:flex;align-items:center;justify-content:center;font-family:"Syne",sans-serif;font-size:18px;font-weight:800;color:#fff;flex-shrink:0;}
.emp-info h2{font-family:"Syne",sans-serif;font-size:20px;font-weight:800;color:var(--text);}
.emp-meta{display:flex;gap:8px;margin-top:7px;flex-wrap:wrap;}
.tag{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;}
.tag.id{background:rgba(0,102,255,0.07);color:#3366dd;}
.tag.city{background:rgba(247,148,29,0.1);color:var(--orange);}
.tag.hub{background:rgba(120,80,220,0.07);color:#7050dc;}
.total-badge{text-align:right;}
.total-badge .tlabel{font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}
.total-badge .amount{font-family:"Syne",sans-serif;font-size:32px;font-weight:800;color:var(--green);}
.breakdown-grid{background:#fff;border:1px solid var(--border);border-top:none;border-radius:0 0 16px 16px;overflow:hidden;margin-bottom:30px;box-shadow:var(--shadow);}
.section-head{background:var(--surface2);padding:10px 28px;border-bottom:1px solid var(--border);}
.section-head span{font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--muted);}
.brow{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;border-bottom:1px solid #f0f2f5;transition:background 0.15s;gap:16px;}
.brow:last-child{border-bottom:none;}
.brow:hover{background:#fafbfc;}
.brow .fname{font-size:13px;color:var(--muted);font-weight:400;flex:1;}
.brow .fval{font-size:14px;color:var(--text);font-weight:500;text-align:right;min-width:110px;}
.brow .fval.money{color:var(--green);font-family:"Syne",sans-serif;font-size:15px;font-weight:700;}
.brow .fval.paid{color:var(--text);font-family:"Syne",sans-serif;font-size:15px;font-weight:700;}
.brow .fval.zero{color:#bcc5d6;}
.brow .fval.count{color:var(--orange);font-family:"Syne",sans-serif;font-size:15px;font-weight:700;}
.info-note{background:#fffaf5;border:1px solid rgba(247,148,29,0.15);border-radius:10px;padding:12px 16px;margin-top:16px;font-size:12px;color:var(--muted);line-height:1.7;}
.info-note strong{color:var(--text);}
.footer{text-align:center;margin-top:56px;padding-top:20px;border-top:1px solid var(--border);}
.footer img{height:28px;opacity:0.45;margin-bottom:8px;}
.footer p{font-size:11px;color:var(--muted);letter-spacing:1px;}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.35}}
@media(max-width:580px){
  .input-row{flex-direction:column;}
  .emp-header{flex-direction:column;align-items:flex-start;}
  .total-badge{text-align:left;}
  .topbar{padding:12px 16px;}
  .page{padding:24px 14px 60px;}
}
</style>
</head>

function fmtMoney(v){
  if(v === 0 || v === null || v === undefined) return "-";
  return "Rs " + Number(v).toLocaleString("en-IN");
}
function fmtMoneyForce(v){
  return "Rs " + Number(v || 0).toLocaleString("en-IN");
}
function fmtCount(v){
  if(v === 0 || v === null || v === undefined) return "-";
  return String(v);
}
function initials(name){
  var p = name.trim().split(" ").filter(Boolean);
  return (p[0][0] + (p[1] ? p[1][0] : "")).toUpperCase();
}
function showErr(msg){
  var d = document.getElementById("errorMsg");
  d.textContent = msg;
  d.classList.add("show");
}

function doSearch(){

      '<div class="section-head"><span>Arrears Breakdown</span></div>' +
      '<div class="brow"><span class="fname">MG Added (count)</span><span class="' + mgClass + '">' + fmtCount(row.mg_added) + '</span></div>' +
      '<div class="brow"><span class="fname">MG Amount (Rs 520 &times; count)</span><span class="' + mgAmtClass + '">' + fmtMoney(row.mg_amount) + '</span></div>' +
      '<div class="brow"><span class="fname">Asset Refund</span><span class="fval money">' + fmtMoneyForce(row.asset_refund) + '</span></div>' +
      '<div class="brow"><span class="fname"><strong style="color:var(--text);">Total Arrears</strong></span><span class="fval money" style="font-size:17px;">' + fmtMoneyForce(row.total_arrears) + '</span></div>' +
    '</div>' +
    '<div class="info-note"><strong>Note:</strong> Arrears will be credited along with the next payout cycle. For any discrepancy, please reach out to your Team Lead.</div>';

  card.classList.add("show");
  card.scrollIntoView({behavior:"smooth", block:"start"});
}

  document.getElementById("empInput").addEventListener("keydown", function(e){
    if(e.key === "Enter") doSearch();
  });
  document.getElementById("empInput").focus();
});
</script>
